replicaCount: 2

image:
  repository: ghcr.io/YOUR_USER/sample-fastapi
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: app.localtest.me

resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits:   { cpu: 250m, memory: 128Mi }

serviceMonitor:
  enabled: true
