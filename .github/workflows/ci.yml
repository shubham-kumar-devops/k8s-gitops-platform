
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-manifests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          find . -name '*.yaml' \
            -not -path './.git/*' \
            -not -path './apps/sample-fastapi/chart/*' \
            -print0 | xargs -0 kubeconform -strict -ignore-missing-schemas -summary

  helm-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint apps/sample-fastapi/chart

  build-and-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/sample-fastapi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}